<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculadora-conteiner">
        <h1>Calculadora</h1>
        <div class="input">
            <input type="number" id="num1">
        </div>
        <div class="input">
            <input type="number" id="num2">
        </div>
        <div class="boton-group">
            <button onclick="calculate('sum')">+</button>
            <button onclick="calculate('substract')">-</button>
            <button onclick="calculate('divide')">/</button>
            <button onclick="calculate('multiply')">x</button>
        </div>
        <div class="reset-group">
            <button id="clearBtn" onclick="clearInputs()">Limpiar Campos</button>
        </div>
        <div class="result-area">
            <h2>Resultado:</h2>
            <div id="resultado">...</div>
        </div>
    </div>

    <div class="log-container">
        <h2>Historial</h2>
        <ul id="log">
            <li>No hay calculos anteriores</li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
